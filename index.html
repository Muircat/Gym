<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Tracker</title>
  <meta name="description" content="A simple machine-based gym tracker with progression suggestions, body-weight trends and calculators.">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Crect x='10' y='22' width='8' height='20' rx='2' fill='white'/%3E%3Crect x='46' y='22' width='8' height='20' rx='2' fill='white'/%3E%3Crect x='18' y='29' width='28' height='6' rx='2' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect x="6" y="20" width="10" height="24" rx="3"/><rect x="48" y="20" width="10" height="24" rx="3"/><rect x="16" y="28" width="32" height="8" rx="3"/></svg>
      Gym Tracker
    </div>
    <nav class="tabs" aria-label="Sections">
      <button data-tab="workout" class="active">Workout</button>
      <button data-tab="progress">Progress</button>
      <button data-tab="body">Body</button>
      <button data-tab="calc">Calculators</button>
      <button data-tab="settings">Settings</button>
    </nav>
  </header>

  <main id="app" class="container"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="js/calc.js"></script>
  <script src="js/plan.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
